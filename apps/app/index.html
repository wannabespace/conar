<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta name="apple-mobile-web-app-title" content="Tamery" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline' https://eu.i.posthog.com https://eu-assets.i.posthog.com 'wasm-unsafe-eval'; worker-src 'self' blob: file: http://localhost:*;"
    />
    <title>Tamery</title>
    <script>
      if (window.electron) {
        document.documentElement.classList.add('electron')
        if (/Mac/i.test(navigator.userAgent)) {
          document.documentElement.classList.add('mac')
        }
      }

      const theme = localStorage.getItem('tamery.theme')
      if (
        theme === 'dark' ||
        ((theme === null || JSON.parse(theme) === 'system') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div
      id="static-titlebar"
      class="fixed inset-x-0 top-0 h-10"
      style="-webkit-app-region: drag"
    ></div>
    <div id="root" class="relative isolate z-10 flex min-h-svh flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
