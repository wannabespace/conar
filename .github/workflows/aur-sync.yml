name: Publish to AUR

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  publish:
    name: Push to aur.archlinux.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set pkgver from the desktop app
        id: version
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          sed -i "s/^pkgver=.*/pkgver=$version/" aur/PKGBUILD
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish tamery-bin
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: tamery-bin
          pkgbuild: aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ${{ secrets.AUR_GIT_NAME }}
          commit_email: ${{ secrets.AUR_GIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ steps.version.outputs.version }}
